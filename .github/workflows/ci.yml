name: AssuraPay CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          # 22 for pnpm 11 compatibility, and because REOS runs TypeScript
          # directly via native type stripping (>= 22.18).
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # repo:certify runs lint, typecheck, unit/integration/e2e tests,
      # architecture, dependency, security and contract validation, and the
      # production build. It is the single certification gate.
      - run: pnpm repo:certify

  # Durability is a separate job because it needs a database, and because it must
  # be impossible to satisfy without one. `certify:postgres` fails when
  # ASSURAPAY_TEST_DATABASE_URL is unset rather than skipping, so a missing service
  # container turns this job red instead of green-and-empty.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned to the version the store is developed against. A durability claim
        # is about a specific engine's transaction and locking behaviour.
        image: postgres:16
        env:
          POSTGRES_USER: assurapay
          POSTGRES_PASSWORD: assurapay
          POSTGRES_DB: assurapay_test
        ports:
          - 5432:5432
        # The suites create and drop databases of their own, so the job waits for a
        # server that is actually accepting connections rather than for the
        # container to have started.
        options: >-
          --health-cmd "pg_isready -U assurapay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # CREATEDB, because the historical migration set is not schema-relocatable:
      # one of its SECURITY DEFINER functions pins search_path=public, so the
      # full-set test needs its own database rather than its own schema.
      # A non-superuser role to run the suites as.
      #
      # The service container creates POSTGRES_USER as a SUPERUSER, and a superuser is exempt
      # from every Row Level Security policy — FORCE included. Running the tenancy suites as
      # one made them pass or fail on what the data happened to be rather than on what the
      # policies enforce, which is the original defect of this capability wearing a different
      # hat. `certifyRowLevelSecurity` now reports RLS_ROLE_BYPASSES for such a role; this
      # gives it a role that does not.
      #
      # CREATEDB because the historical migration set is not schema-relocatable and needs its
      # own database. CREATEROLE so the suites can provision the application role the denial
      # probes run as.
      - name: Create a non-superuser role for the suites
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE assurapay_ci LOGIN PASSWORD 'assurapay_ci' CREATEDB CREATEROLE" \
            -c "GRANT ALL ON DATABASE assurapay_test TO assurapay_ci" \
            -c "GRANT ALL ON SCHEMA public TO assurapay_ci"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT rolsuper FROM pg_roles WHERE rolname = 'assurapay_ci'" | grep -q ' f'
        env:
          ADMIN_URL: postgres://assurapay:assurapay@127.0.0.1:5432/assurapay_test

      - name: Certify durability against real PostgreSQL
        run: pnpm certify:postgres
        env:
          ASSURAPAY_TEST_DATABASE_URL: postgres://assurapay_ci:assurapay_ci@127.0.0.1:5432/assurapay_test

      # Schema ownership, as its own signal rather than as part of a 115-test count. Two
      # databases have to reach the same canonical state by different routes: a fresh one
      # applying every migration, and an existing one that applies migrations through the RLS
      # baseline, is seeded as a real deployment would have been, and only then receives
      # reconciliation. The second is the path every already-running database takes, and the
      # only one that can show the retirement is safe rather than that a fresh install looks
      # tidy. The suite also proves the migration refuses, without dropping anything, when a
      # historical table holds rows — the whole safety argument for retiring them.
      - name: Certify trust schema ownership, fresh and upgraded
        run: |
          pnpm vitest run --config vitest.postgres.config.ts \
            packages/database-testing/src/schema-ownership.postgres.test.ts
        env:
          ASSURAPAY_TEST_DATABASE_URL: postgres://assurapay_ci:assurapay_ci@127.0.0.1:5432/assurapay_test

      # Proves the gate cannot pass without a database. If this step succeeds, the
      # suites are skipping rather than running, and the durability evidence above
      # is worthless.
      # The production composition path, against the same service: a runtime built from
      # production-like configuration, state written through it, and the same state
      # recovered by a second runtime on a new pool.
      - name: Certify the production runtime
        run: pnpm certify:runtime
        env:
          ASSURAPAY_TEST_DATABASE_URL: postgres://assurapay_ci:assurapay_ci@127.0.0.1:5432/assurapay_test

      # Browser certification, on the same PostgreSQL service and against the production
      # build. The suite provisions its own database through the governed migration
      # runner and starts `next start`, so a green run is a statement about the
      # composition a deployment uses rather than about `next dev`. Chromium comes from
      # the runner image; `playwright install --with-deps chromium` fetches it in CI
      # because the pinned path this repository uses locally does not exist there.
      - name: Install Chromium for browser certification
        run: pnpm exec playwright install --with-deps chromium

      - name: Certify the product through a real browser
        run: pnpm certify:browser
        env:
          ASSURAPAY_TEST_DATABASE_URL: postgres://assurapay_ci:assurapay_ci@127.0.0.1:5432/assurapay_test
          # GitHub's stock postgres:16 service is intentionally plaintext. The browser
          # gate is a test harness, so run its durable adapter explicitly as PostgreSQL
          # while leaving production's TLS-required configuration policy untouched.
          ASSURAPAY_DEPLOYMENT: test
          ASSURAPAY_PERSISTENCE_ADAPTER: postgres
          ASSURAPAY_E2E_DATABASE_SSL: disable
          CI: 'true'

      - name: Publish browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Prove the gate fails with no database configured
        run: |
          if pnpm certify:postgres; then
            echo "certify:postgres passed with no database configured; the suites are skipping" >&2
            exit 1
          fi
