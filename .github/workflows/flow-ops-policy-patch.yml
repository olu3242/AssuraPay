name: Flow OS operational policy patch

on:
  push:
    branches: [feat/flow-os-operations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-os-operations
      - name: Patch canonical permission surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          catalogue = Path('packages/permissions/src/catalogue.ts')
          s = catalogue.read_text()
          needle = "      'executions:create',\n      'executions:transition',"
          if "'executions:read'" not in s:
              s = s.replace(needle, "      'executions:create',\n      'executions:read',\n      'executions:transition',", 1)
          catalogue.write_text(s)

          routes = Path('apps/web/lib/route-permissions.ts')
          s = routes.read_text()
          needle = "  '/api/v1/flow-tasks/[id]/decisions|POST': { access: 'permission', permissionKey: 'authorization-decisions:approve', segregatedFrom: ['payment-instructions:submit'] },\n"
          insertion = (
              "  '/api/v1/flow-tasks|GET': { access: 'permission', permissionKey: 'executions:read' },\n"
              "  '/api/v1/flow-tasks/[id]/decisions|POST': { access: 'permission', permissionKey: 'authorization-decisions:approve', segregatedFrom: ['payment-instructions:submit'] },\n"
              "  '/api/v1/flows/[id]|GET': { access: 'permission', permissionKey: 'executions:read' },\n"
          )
          if "'/api/v1/flow-tasks|GET'" not in s:
              s = s.replace(needle, insertion)
          post_needle = "  '/api/v1/flows|POST': { access: 'permission', permissionKey: 'executions:create' },"
          if "'/api/v1/flows|GET'" not in s:
              s = s.replace(post_needle, "  '/api/v1/flows|GET': { access: 'permission', permissionKey: 'executions:read' },\n" + post_needle)
          routes.write_text(s)
          PY
      - name: Commit policy patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/permissions/src/catalogue.ts apps/web/lib/route-permissions.ts
          git commit -m "feat(flow-os): add read-only operational permission"
          git push origin HEAD:feat/flow-os-operations
