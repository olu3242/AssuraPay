name: Flow OS diagnostics

on:
  push:
    branches: [feat/flow-orchestration-os]

jobs:
  static-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: TypeScript diagnostics
        continue-on-error: true
        run: pnpm typecheck
      - name: REOS typecheck only
        continue-on-error: true
        run: pnpm repo:certify --only=typecheck
      - name: REOS architecture only
        continue-on-error: true
        run: pnpm repo:certify --only=architecture
      - name: REOS governance only
        continue-on-error: true
        run: pnpm repo:certify --only=governance
      - name: Flow and route diagnostics
        continue-on-error: true
        run: pnpm vitest run packages/flow-orchestration apps/web/lib/route-coverage.test.ts apps/web/lib/route-permissions.test.ts --reporter=verbose
      - name: REOS unit only
        continue-on-error: true
        run: pnpm repo:certify --only=test:unit
      - name: REOS integration only
        continue-on-error: true
        run: pnpm repo:certify --only=test:integration
      - name: REOS e2e only
        continue-on-error: true
        run: pnpm repo:certify --only=test:e2e
      - name: Production build diagnostics
        continue-on-error: true
        run: pnpm build
      - name: REOS build only
        continue-on-error: true
        run: pnpm repo:certify --only=build

  runtime-diagnostics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assurapay
          POSTGRES_PASSWORD: assurapay
          POSTGRES_DB: assurapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assurapay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Create test role
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE assurapay_ci LOGIN PASSWORD 'assurapay_ci' CREATEDB CREATEROLE" \
            -c "GRANT ALL ON DATABASE assurapay_test TO assurapay_ci" \
            -c "GRANT ALL ON SCHEMA public TO assurapay_ci"
        env:
          ADMIN_URL: postgres://assurapay:assurapay@127.0.0.1:5432/assurapay_test
      - name: Runtime diagnostics
        continue-on-error: true
        run: pnpm certify:runtime -- --reporter=verbose
        env:
          ASSURAPAY_TEST_DATABASE_URL: postgres://assurapay_ci:assurapay_ci@127.0.0.1:5432/assurapay_test
